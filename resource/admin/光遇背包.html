{{extend defaultLayout}}
{{block 'css'}}

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="{{_res_path}}/admin/Message.css">
</head>
<style>
	.container {
		background: url("{{_res_path}}/admin/imgs/bg/{{bg}}") #D9D9F3 top !important;
		background-size: cover !important;
		width: 800px;
	}

	.profile-picture {
		float: left;
		width: 200px;
		height: 200px;
		margin-right: 20px;
	}
</style>
{{/block}}
{{block 'main'}}

<div class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<img src="{{头像}}" alt="头像" class="profile-picture" style="width:170px; height:170px;">
			<h1>光遇背包</h1>
			<h2>ID：{{用户ID}}</h2>
		</li>
	</ul>
</div>

<div class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<h1><em>背包信息：</em></h1>
			<h2>蜡烛保护卡：{{蜡烛保护卡}}</h2>
			<h2>签到双倍卡：{{签到双倍卡}}</h2>
		</li>
	</ul>
</div>
{{/block}}
