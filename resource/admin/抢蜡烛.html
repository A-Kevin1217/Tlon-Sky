{{extend defaultLayout}}
{{block 'css'}}
<style>
	.container {
		background: #D9D9F3 top;
		width: 500px;
	}

	body {
		background: #D9D9F3 top;
		width: 400px;
		position: relative;
	}

	.head-box {
		margin: 0 0 80px 0;
	}

	.profile-picture {
		float: left;
		width: 150px;
		height: 150px;
		margin-right: 20px;
	}

	.cfg-box {
		margin-top: 20px;
		margin-bottom: 20px;
		padding: 5px 15px;
		overflow: hidden;
		box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
		position: relative;
		background: rgba(35, 38, 57, 0.8);
		-webkit-backdrop-filter: blur(7px);
		backdrop-filter: blur(7px);
		background-color: rgba(255, 255, 255, 0.24);
		border-radius: 26px;
		box-shadow: 30px 30px 30px -10px rgba(0, 0, 0, 0.15), inset 15px 15px 10px rgba(75, 142, 230, 0.123), -15px -15px 35px rgba(111, 175, 248, 0.144), inset -1px -1px 10px rgba(0, 0, 0, 0.2);
	}

	.cfg-group {
		color: #fff;
		font-size: 22px;
		font-weight: bold;
		padding: 10px 20px;
	}

	.cfg-li {
		color: #4e5769;
		font-weight: normal;
		border-radius: 18px;
		min-height: 36px;
		position: relative;
		overflow: hidden;
		margin-bottom: 10px;
		background: rgba(203, 196, 190, 0);
	}

	#box3 {
		text-align: center;
		width: 100px;
		height: 100px;
		position: absolute;
		top: 17.5%;
		right: 17.5%;
		padding: 5px;
		background: rgba(245, 246, 248, 0.158);
		box-shadow: 0 8px 32px 0 #bae0f3;
		border-radius: 10%;
		border: 1px solid rgba(251, 246, 246, 0.959);
		font-weight: 1000px;
		transform: scale(0.3);
		transform-origin: top right;
	}

	.box {
		margin: 20px;
		padding: 10px;
		background: rgba(255, 255, 255, 0.45);
		box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
		-webkit-backdrop-filter: blur(10px);
		backdrop-filter: blur(10px);
		border-radius: 10px;
		border: 1px solid rgba(255, 255, 255, 0.18);
		font-weight: 700;
	}

	.cfg-hint {
		font-size: 16px;
		font-weight: normal;
		margin-top: 3px;
		margin-bottom: -3px;
	}

	.cfg-status {
		position: absolute;
		top: 0;
		right: 0;
		height: 36px;
		width: 160px;
		text-align: center;
		line-height: 36px;
		font-size: 20px;
		color: #495366;
		font-weight: bold;
		border-radius: 0 16px 16px 0;
	}

	.cfg-status.status-off {
		color: #a95151;
	}

	.cfg-desc {
		font-size: 16px;
		color: white;
		margin: 5px 0 5px 20px;
	}

	.badge {
		display: inline-block;
		vertical-align: top;
		height: 18px;
		padding: 0 6px;
		border-radius: 3px;
		background: #f4cd00;
		color: #fff;
		font-size: 14px;
		line-height: 18px;
	}

	.lime {
		color: lime;
	}

	.red {
		color: red;
	}

	.text-container {
		width: 250px;
		overflow: hidden;
		white-space: nowrap;
		text-overflow: ellipsis;
	}
</style>
{{/block}}
{{block 'main'}}
<h1>{{抢蜡烛状态}}</h1>
<section class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<img src="{{头像}}" alt="头像" class="profile-picture">
			<h1 class="text-container">昵称：{{昵称}}</h1>
			<h2 class="text-container">ID：{{用户ID}}</h2>
			<h2>白蜡数：{{当前蜡烛}} + <span class="lime">{{抢得蜡烛}}</span></h2>
			<h2>抢蜡烛次数：{{当前抢蜡烛次数}} + <span class="lime">1</span></h2>
		</li>
	</ul>
</section>

<section class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<img src="{{被抢人头像}}" alt="头像" class="profile-picture">
			<h1 class="text-container">昵称：{{被抢人昵称}}</h1>
			<h2 class="text-container">ID：{{被抢用户ID}}</h2>
			<h2>白蜡数：{{被抢人当前蜡烛}} - <span class="red">{{抢得蜡烛}}</span></h2>
			<h2>被抢次数：{{当前被抢次数}} + <span class="red">1</span></h2>
		</li>
	</ul>
</section>
{{/block}}
