{{extend defaultLayout}}
{{block 'css'}}

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="{{_res_path}}/admin/Message.css">
</head>
<style>
	.container {
		background: #D9D9F3 top !important;
		background-size: cover !important;
		width: 400px;
	}

	.profile-picture {
		float: left;
		width: 200px;
		height: 200px;
		border-radius: 50%;
		margin-right: 20px;
	}
</style>
{{/block}}
{{block 'main'}}

<div class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<img src="{{HEAD_PORTRAIT}}" alt="头像" class="profile-picture" style="width:170px; height:170px;">
			<h1>{{NICKNAME}}</h1>
			<h1>当前等级：{{LEVEL}}</h1>
			<h1>签到成功！</h1>
			<h1></h1>
		</li>
	</ul>
</div>
<div class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<h1><em>签到信息</em></h1>
			<h2>白蜡 + <span class="color: lime;">{{GET_BL}}</span></h2>
			<h2>季蜡 + <span class="color: lime;">{{GET_JL}}</span></h2>
			<h2>能量值 + <span class="color: lime;">{{GET_NLZ}}</span></h2>
			<h2>{{CUMULATIVE_HINT}}</h2>
			<h2>{{CONSECUTIVE_HINT}}</h2>
		</li>
	</ul>
</div>
<div class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<h2>用户总数量：{{USER_NUMBER}}</h2>
		</li>
	</ul>
</div>
{{/block}}
