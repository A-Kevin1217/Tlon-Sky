{{extend defaultLayout}}
{{block 'css'}}

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="{{_res_path}}/admin/Message.css">
</head>
<style>
	.container {
		background: #D9D9F3 top !important;
		background-size: cover !important;
		width: 800px;
	}
	.profile-picture {
		float: left;
		width: 200px;
		height: 200px;
		border-radius: 50%;
		margin-right: 20px;
	}
</style>
{{/block}}
{{block 'main'}}

<div class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<img src="{{头像}}" alt="头像" class="profile-picture" style="width:170px; height:170px;">
			<h1>{{昵称}}</h1>
			<h1>当前等级：{{等级}}</h1>
			<h1>签到成功！</h1>
			<h1></h1>
		</li>
	</ul>
</div>
<div class="cfg-box">
	<ul class="cfg-ul">
		<li class="cfg-li">
			<h1><em>签到信息</em></h1>
			<h2>白蜡数：{{数量_白}} + <span class="highlight">{{获得白蜡}}</span></h2>
			<h2>季蜡数：{{数量_季}} + <span class="highlight">{{获得季蜡}}</span></h2>
			<h2>能量值：{{数量_能量}} + <span class="highlight">{{获得能量值}}</span></h2>
			<h2>{{累计签到提示}}</h2>
			<h2>{{连续签到提示}}</h2>
		</li>
	</ul>
</div>
{{/block}}
