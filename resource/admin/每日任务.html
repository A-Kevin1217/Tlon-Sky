<style>
    body {
        background: #D9D9F3 top;
        width: 3280px;
    }

    .cfg-box {
        margin-top: 20px;
        margin-bottom: 20px;
        padding: 5px 15px;
        overflow: hidden;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
        position: relative;
        background: rgba(35, 38, 57, 0.8);
        -webkit-backdrop-filter: blur(7px);
        backdrop-filter: blur(7px);
        background-color: rgba(255, 255, 255, 0.24);
        border-radius: 26px;
        box-shadow: 30px 30px 30px -10px rgba(0, 0, 0, 0.15), inset 15px 15px 10px rgba(75, 142, 230, 0.123), -15px -15px 35px rgba(111, 175, 248, 0.144), inset -1px -1px 10px rgba(0, 0, 0, 0.2);
    }

    .cfg-li {
        height: 1800;
        color: #4e5769;
        font-weight: normal;
        border-radius: 18px;
        min-height: 36px;
        position: relative;
        overflow: hidden;
        margin-bottom: 10px;
        background: rgba(203, 196, 190, 0);
    }

    .img {
        display: flex;
        gap: 10px;
        margin-bottom: 66px;
    }

    .img:last-child {
        margin-bottom: 0;
    }

    .img1 {
        display: flex;
        gap: 10px;
        margin-top: 66px;
    }

    .img1:first-child {
        margin-top: 0;
    }

    .img img:last-child {
        margin-right: 0;
    }

    .long-image {
        position: absolute;
        top: 0px;
        left: 2280px;
        width: 1200px;
        height: 1800px;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    .text-container {
        font-size: 50px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }
</style>

<body>
    <section class="cfg-box">
        <ul class="cfg-ul">
            <li class="cfg-li">
                <div class="img">
                    <img id="img1" src="https://api.t1qq.com/api/sky/gy/sc/json/mf.jpg"
                        style="width: 1260px; height: 800px;">
                    <img id="img2" src="https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/mrrw.jpg"
                        style="width: 1260px; height: 800px;">
                </div>
                <h1 class="text-container">{{text}}</h1>
                <div class="img1">
                    <img id="img3" src="https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/scjl.jpg"
                        style="width: 1260px; height: 800px;">
                    <img id="img4" src="https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/scdl.jpg"
                        style="width: 1260px; height: 800px;">
                </div>
                <img id="img5" src="https://gitee.com/Tloml-Starry/resources/raw/master/resources/img/光遇/当前/当前复刻.jpg"
                    class="long-image">
            </li>
        </ul>
    </section>

    <script>
        // 获取图片元素
        const imgElement1 = document.getElementById('img1');
        const imgElement2 = document.getElementById('img2');
        const imgElement3 = document.getElementById('img3');
        const imgElement4 = document.getElementById('img4');

        // 生成随机数
        const randomNum1 = Math.floor(Math.random() * 10000);
        const randomNum2 = Math.floor(Math.random() * 10000);
        const randomNum3 = Math.floor(Math.random() * 10000);
        const randomNum4 = Math.floor(Math.random() * 10000);

        // 修改图片URL
        const imageUrl1 = 'https://api.t1qq.com/api/sky/gy/sc/json/mf.jpg';
        const imageUrl2 = 'https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/mrrw.jpg';
        const imageUrl3 = 'https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/scjl.jpg';
        const imageUrl4 = 'https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/scdl.jpg';
        const newImageUrl1 = `${imageUrl1}?random=${randomNum1}`;
        const newImageUrl2 = `${imageUrl2}?random=${randomNum2}`;
        const newImageUrl3 = `${imageUrl3}?random=${randomNum3}`;
        const newImageUrl4 = `${imageUrl4}?random=${randomNum4}`;

        // 更新图片元素
        imgElement1.src = newImageUrl1;
        imgElement2.src = newImageUrl2;
        imgElement3.src = newImageUrl3;
        imgElement4.src = newImageUrl4;
    </script>
</body>
