<style>
    body {
        background: #D9D9F3 top;
        width: 3280px;
    }

    .cfg-box {
        margin-top: 20px;
        margin-bottom: 20px;
        padding: 5px 15px;
        overflow: hidden;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
        position: relative;
        background: rgba(35, 38, 57, 0.8);
        -webkit-backdrop-filter: blur(7px);
        backdrop-filter: blur(7px);
        background-color: rgba(255, 255, 255, 0.24);
        border-radius: 26px;
        box-shadow: 30px 30px 30px -10px rgba(0, 0, 0, 0.15), inset 15px 15px 10px rgba(75, 142, 230, 0.123), -15px -15px 35px rgba(111, 175, 248, 0.144), inset -1px -1px 10px rgba(0, 0, 0, 0.2);
    }

    .cfg-li {
        height: 1800;
        color: #4e5769;
        font-weight: normal;
        border-radius: 18px;
        min-height: 36px;
        position: relative;
        overflow: hidden;
        margin-bottom: 10px;
        background: rgba(203, 196, 190, 0);
    }

    .img {
        display: flex;
        gap: 10px;
        margin-bottom: 66px;
    }

    .img:last-child {
        margin-bottom: 0;
    }

    .img1 {
        display: flex;
        gap: 10px;
        margin-top: 66px;
    }

    .img1:first-child {
        margin-top: 0;
    }

    .img img:last-child {
        margin-right: 0;
    }

    .long-image {
        position: absolute;
        top: 0px;
        left: 2280px;
        width: 1200px;
        height: 1800px;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    .text-container {
        font-size: 50px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }
</style>

<body>
    <section class="cfg-box">
        <ul class="cfg-ul">
            <li class="cfg-li">
                <div class="img">
                    <img src="https://api.t1qq.com/api/sky/gy/sc/json/mf.jpg" style="width: 1260px; height: 800px;">
                    <img src="https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/mrrw.jpg"
                        style="width: 1260px; height: 800px;">
                </div>
                <h1 class="text-container">{{text}}</h1>
                <div class="img1">
                    <img src="https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/scjl.jpg"
                        style="width: 1260px; height: 800px;">
                    <img src="https://api.t1qq.com/api/sky/gy/sc/tlonsky/json/scdl.jpg"
                        style="width: 1260px; height: 800px;">
                </div>
                <img src="https://gitee.com/Tloml-Starry/Tlon-Sky-reprint/raw/master/image/Reprint.png"
                    class="long-image">
            </li>
        </ul>
    </section>
</body>
