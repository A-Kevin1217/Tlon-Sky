{{extend defaultLayout}}
{{block 'css'}}

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{_res_path}}/admin/Message.css">
</head>
<style>
    .container {
        background: url("{{_res_path}}/admin/imgs/bg/{{bg}}") #D9D9F3 top !important;
        background-size: cover !important;
        width: 800px;
    }

    .profile-picture {
        float: left;
        width: 200px;
        height: 200px;
        margin-right: 20px;
    }
</style>
{{/block}}
{{block 'main'}}

<div class="cfg-box">
    <ul class="cfg-ul">
        <li class="cfg-li">
            <img src="{{头像}}" alt="头像" class="profile-picture" style="width:170px; height:170px;">
        </li>
    </ul>
</div>

<div class="cfg-box">
    <ul class="cfg-ul">
        <li class="cfg-li">
            <h1><em>排行信息</em></h1>
            <h2>白蜡排行第{{白蜡排名}}</h2>
            <h2>季蜡排行第{{季蜡排名}}</h2>
            <h2>亏损排行第{{亏损排名}}</h2>
            <h2>赚取排行第{{赚取排名}}</h2>
            <h2>抢蜡排行第{{抢蜡排名}}</h2>
            <h2>被抢排行第{{被抢排名}}</h2>
            <h2>连签排行第{{连签排名}}</h2>
            <h2>累签排行第{{累签排名}}</h2>
        </li>
    </ul>
</div>
{{/block}}
