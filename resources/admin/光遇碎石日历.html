<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光遇碎石日历</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --calendar-bg: #2f3542;
            --black-stone: #4a4a4a;
            --red-stone: #ff4757;
            --highlight: #3498db;
            --button-bg: #3498db;
            --button-hover: #2980b9;
        }

        html {
            width: 900px;
        }

        body {
            width: 900px;
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: var(--random-gradient);
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .title {
            text-align: center;
            font-size: 2em;
            margin-bottom: 20px;
            color: var(--highlight);
        }

        .calendar-container {
            background-color: var(--calendar-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            flex-grow: 1;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-nav {
            display: flex;
            gap: 10px;
        }

        .month-nav button {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .month-nav button:hover {
            background-color: var(--button-hover);
        }

        .current-month {
            font-size: 1.5em;
        }

        .weekdays,
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .weekdays {
            margin-bottom: 10px;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
        }

        .day {
            background-color: var(--calendar-bg);
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .day:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .day::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle, transparent 20%, var(--calendar-bg) 80%);
            transform: scale(2);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
        }

        .day:active::before {
            transform: scale(0);
            opacity: 1;
            transition: 0s;
        }

        .black-stone {
            background-color: var(--black-stone);
        }

        .red-stone {
            background-color: var(--red-stone);
        }

        .other-month {
            opacity: 0.5;
        }

        .today {
            border: 2px solid var(--highlight);
        }

        .selected {
            background-color: var(--highlight);
        }

        .date {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .map,
        .location {
            font-size: 0.8em;
        }

        .detail-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--calendar-bg);
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .detail-box:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        footer {
            background-color: var(--calendar-bg);
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .contact-info a {
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .contact-info a:hover {
            color: var(--highlight);
        }

        .ri-github-fill,
        .ri-mail-fill,
        .ri-qq-fill {
            font-size: 1.2em;
        }

        .counter {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 100px;
            height: auto;
            z-index: 1000;
        }

        /* 定义十种渐变色 */
        .gradient-1 {
            --random-gradient: linear-gradient(45deg, #ff9a9e, #fad0c4);
        }

        .gradient-2 {
            --random-gradient: linear-gradient(45deg, #a18cd1, #fbc2eb);
        }

        .gradient-3 {
            --random-gradient: linear-gradient(45deg, #fad0c4, #ffd1ff);
        }

        .gradient-4 {
            --random-gradient: linear-gradient(45deg, #ffecd2, #fcb69f);
        }

        .gradient-5 {
            --random-gradient: linear-gradient(45deg, #ff9a9e, #fecfef);
        }

        .gradient-6 {
            --random-gradient: linear-gradient(45deg, #f6d365, #fda085);
        }

        .gradient-7 {
            --random-gradient: linear-gradient(45deg, #fbc2eb, #a6c1ee);
        }

        .gradient-8 {
            --random-gradient: linear-gradient(45deg, #fdcbf1, #e6dee9);
        }

        .gradient-9 {
            --random-gradient: linear-gradient(45deg, #a1c4fd, #c2e9fb);
        }

        .gradient-10 {
            --random-gradient: linear-gradient(45deg, #d4fc79, #96e6a1);
        }
    </style>
</head>

<body>
    <script>
        const gradients = [
            'gradient-1', 'gradient-2', 'gradient-3', 'gradient-4', 'gradient-5',
            'gradient-6', 'gradient-7', 'gradient-8', 'gradient-9', 'gradient-10'
        ];
        const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];
        document.body.classList.add(randomGradient);
    </script>
    <div class="container">
        <h1 class="title">光遇碎石日历</h1>
        <div class="calendar-container">
            <div class="calendar-header">
                <div class="month-nav">
                    <button id="prevMonth">上个月</button>
                    <button id="nextMonth">下个月</button>
                </div>
                <div class="current-month" id="currentMonth"></div>
            </div>
            <div class="weekdays" id="weekdays"></div>
            <div class="calendar" id="calendar"></div>
            <div class="detail-box" id="detailBox"></div>
            <div class="detail-box" id="routeMap" style="text-align: center; margin-top: 20px;"></div>
        </div>
    </div>
    <footer>
        <div class="contact-info">
            <a href="https://github.com/Tloml-Starry" target="_blank"><i class="ri-github-fill"></i> GitHub</a>
            <a href="mailto:1947425850@qq.com"><i class="ri-mail-fill"></i> 联系我们</a>
            <a href="https://qm.qq.com/q/FtEkvOjEYM"><i class="ri-qq-fill"></i> QQ群: 392665563</a>
        </div>
    </footer>

    <script>
        let year = "{{@year}}";
        let month = "{{@month}}";

        let currentDate = new Date(year, month, 1);
        if (year === "undefined" || month === "undefined") {
            currentDate = new Date();
            year = new Date().getFullYear();
            month = new Date().getMonth();
        }

        const maps = ['暮土', '禁阁', '云野', '雨林', '霞谷'];
        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        let selectedDate = new Date();

        const locations = {
            '云野': { 2: '蝴蝶平原', 3: '仙乡', 5: '右边隐藏图', 6: '幽光山洞', 0: '圣岛' },
            '雨林': { 2: '荧光森林', 3: '密林遗迹', 5: '大树屋', 6: '雨林神殿', 0: '秘密花园' },
            '霞谷': { 2: '滑冰场', 3: '滑冰场', 5: '圆梦村', 6: '圆梦村', 0: '雪隐峰' },
            '暮土': { 2: '暮土图一', 3: '远古战场', 5: '黑水港湾', 6: '巨兽荒原', 0: '失落方舟' },
            '禁阁': { 2: '星光沙漠', 3: '星光沙漠', 5: '星光沙漠·一隅', 6: '星光沙漠·一隅', 0: '星光沙漠·一隅' },
        };

        function getMapLocation(map, dayOfWeek) {
            return locations[map]?.[dayOfWeek] || '';
        }

        function isSpecialDate(date) {
            const dayOfWeek = date.getDay();
            return date.getDate() <= 15 ? [2, 6, 0].includes(dayOfWeek) : [3, 5, 0].includes(dayOfWeek);
        }

        function getStoneType(date) {
            const dayOfWeek = date.getDay();
            if (date.getDate() <= 15) {
                return dayOfWeek === 2 ? '黑石' : [6, 0].includes(dayOfWeek) ? '红石' : '';
            } else {
                return dayOfWeek === 3 ? '黑石' : [5, 0].includes(dayOfWeek) ? '红石' : '';
            }
        }

        function getFallTimes(date) {
            const dayOfWeek = date.getDay();
            if (dayOfWeek === 0) return ['07:08', '13:08', '19:08'];

            const times = date.getDate() <= 15
                ? getStoneType(date) === '红石' ? ['10:08', '14:08', '22:08'] : ['09:08', '14:08', '19:08']
                : getStoneType(date) === '红石' ? ['11:08', '17:08', '23:08'] : ['09:08', '15:08', '21:08'];

            return times;
        }

        function createCalendar(year = currentDate.getFullYear(), month = currentDate.getMonth()) {
            currentDate = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            document.getElementById('currentMonth').textContent = `${year}年${parseInt(month) + 1}月`;
            document.getElementById('weekdays').innerHTML = weekdays.map(day => `<div class="weekday">${day}</div>`).join('');
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            for (let i = 0; i < new Date(year, month, 1).getDay(); i++) {
                calendar.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= lastDay.getDate(); i++) {
                const date = new Date(year, month, i);
                const dayElement = document.createElement('div');
                dayElement.className = 'day';
                dayElement.dataset.date = date.toISOString();

                if (isSpecialDate(date)) {
                    dayElement.classList.add(getStoneType(date) === '黑石' ? 'black-stone' : 'red-stone');
                }

                if (date.toDateString() === new Date().toDateString()) {
                    dayElement.classList.add('today');
                }

                if (date.toDateString() === selectedDate.toDateString()) {
                    dayElement.classList.add('selected');
                }

                const dateElement = document.createElement('div');
                dateElement.className = 'date';
                dateElement.textContent = i;
                dayElement.appendChild(dateElement);

                if (isSpecialDate(date)) {
                    const mapIndex = (i - 1) % maps.length;
                    const mapElement = document.createElement('div');
                    mapElement.className = 'map';
                    mapElement.textContent = maps[mapIndex];
                    dayElement.appendChild(mapElement);

                    const locationElement = document.createElement('div');
                    locationElement.className = 'location';
                    locationElement.textContent = getMapLocation(maps[mapIndex], date.getDay());
                    dayElement.appendChild(locationElement);
                }

                dayElement.addEventListener('click', handleDateClick);
                calendar.appendChild(dayElement);
            }
        }

        function handleDateClick(event) {
            selectedDate = new Date(event.currentTarget.dataset.date);
            document.querySelectorAll('.day').forEach(day => day.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            updateDetailBox();
        }

        function updateDetailBox() {
            const detailBox = document.getElementById('detailBox');
            const routeMap = document.getElementById('routeMap');
            const isSpecial = isSpecialDate(selectedDate);
            const stoneType = getStoneType(selectedDate);
            const dayOfWeek = selectedDate.getDay();
            const mapIndex = (selectedDate.getDate() - 1) % maps.length;
            const map = maps[mapIndex];
            const location = getMapLocation(map, dayOfWeek);

            if (!isSpecial) {
                detailBox.innerHTML = '<p>今日无碎石</p>';
                routeMap.innerHTML = '';
                return;
            }

            const now = new Date();
            const isPastDate = selectedDate < now && selectedDate.toDateString() !== now.toDateString();

            detailBox.innerHTML = `
                <h3>${selectedDate.getFullYear()}年${selectedDate.getMonth() + 1}月${selectedDate.getDate()}日</h3>
                <p>碎石类型：${stoneType}</p>
                <p>地图：${map}</p>
                ${location ? `<p>坠落位置：${location}</p>` : ''}
                <p>坠落时间：${getFallTimes(selectedDate).join(', ')}</p>
                ${isPastDate ? '<p>坠落已结束</p>' : '<p id="countdown"></p>'}
            `;

            if (location) {
                routeMap.innerHTML = `
                    <h4 style="font-size: 1.5em;">路线图</h4>
                    <img src="https://gitee.com/Tloml-Starry/resources/raw/master/resources/img/%E5%85%89%E9%81%87/ShardRouteMap/${location}.jpg" alt="路线图" style="width: 100%; max-width: 800px; height: auto; display: block; margin: 0 auto;" />
                `;
            } else {
                routeMap.innerHTML = '';
            }

            if (!isPastDate) {
                updateCountdown();
            }
        }

        function updateCountdown() {
            const countdownElement = document.getElementById('countdown');
            if (!countdownElement) return;

            const now = new Date();
            const todayFallTimes = getFallTimes(selectedDate).map(time => {
                const [hours, minutes] = time.split(':').map(Number);
                return new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), hours, minutes);
            });

            let nextFallTime = todayFallTimes.find(time => time > now);

            if (!nextFallTime) {
                const tomorrow = new Date(selectedDate);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const [hours, minutes] = getFallTimes(selectedDate)[0].split(':').map(Number);
                nextFallTime = new Date(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate(), hours, minutes);
            }

            function calculate() {
                const now = new Date();
                let diff = nextFallTime - now;

                if (diff < 0) {
                    countdownElement.textContent = '坠落已结束';
                    return;
                }

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();

                const isFallen = todayFallTimes.some(fallTime => {
                    const fallHour = fallTime.getHours();
                    const fallMinute = fallTime.getMinutes();
                    return currentHour === fallHour && currentMinute >= fallMinute && currentMinute < 60;
                });

                countdownElement.textContent = isFallen ? '碎石已降落' : `距离下次坠落：${hours}小时${minutes}分钟${seconds}秒`;
            }

            calculate();
            setInterval(calculate, 1000);
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            createCalendar(currentDate.getFullYear(), currentDate.getMonth());
            updateDetailBox();
        }

        document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
        document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));

        createCalendar(year, month);
        updateDetailBox();

        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() === 0) {
                createCalendar();
                updateDetailBox();
            }
        }, 1000);
    </script>
</body>

</html>
