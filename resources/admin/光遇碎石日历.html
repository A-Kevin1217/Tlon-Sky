<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>简单日历效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ul {
            display: flex;
            flex-direction: row;
        }

        li {
            display: block;
            list-style: none;
        }

        body {
            background-color: rgb(236, 195, 202);
        }

        .cal-container .year-month>div:first-child>span,
        .cal-container .year-month .pre,
        .cal-container .year-month .next,
        .cal-container .weeks>ul>li,
        .cal-container .days>ul .style-default {
            cursor: pointer;
        }

        .cal-container .year-month .pre:hover,
        .cal-container .year-month .next:hover,
        .cal-container .weeks>ul>li:hover {
            text-shadow: 2px 2px 2px rgb(121, 121, 121);
        }

        .cal-container {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 5%;
            left: 50%;
            width: 600px;
            margin-left: -300px;
            box-shadow: 7px 7px 7px rgb(112, 112, 112);
            background-color: aquamarine;
        }

        .cal-container .year-month {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: rgb(107, 215, 168);
        }

        .cal-container .year-month>div:first-child {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 70px;
            transform: translate(-50%, -50%);
            text-align: center;
            letter-spacing: 3px;
        }

        .cal-container .year-month>div:first-child>span {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
            color: white;
        }

        .cal-container .year-month>div:first-child>span:first-child {
            font-size: 40px;
        }

        .cal-container .year-month>div:first-child>span:last-child {
            font-size: 25px;
        }

        .cal-container .year-month .pre,
        .cal-container .year-month .next {
            position: absolute;
            top: 50%;
            height: 40px;
            transform: translateY(-20px);
            margin: 0 20px;
            font-size: 40px;
            color: white;
        }

        .cal-container .year-month .next {
            right: 0;
        }

        .cal-container .weeks>ul,
        .cal-container .days>ul {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            width: 100%;
            padding: 0 2.5px;
            background-color: rgb(202, 202, 202);
        }

        .cal-container .days>ul {
            padding: 20px 0;
            background-color: rgb(225, 225, 225);
        }

        .cal-container .weeks>ul>li {
            width: 85px;
            font-size: 20px;
            font-weight: 700;
            color: rgb(75, 75, 75);
            text-align: center;
            line-height: 50px;
        }

        .style-default {
            width: 50px;
            height: 50px;
            margin: 0 17.5px;
            font-size: 20px;
            font-weight: 700;
            color: rgb(75, 75, 75);
            text-align: center;
            line-height: 50px;
        }

        .days>ul .style-default:hover {
            background-color: rgb(202, 202, 202);
        }

        .cal-container .days>ul .bg-style {
            background-color: rgb(107, 215, 168);
        }

        .cal-container .days>ul .bgg-style {
            background-color: rgb(243, 104, 104);
        }

        .cal-container .days>ul .bggg-style {
            background-color: rgb(126, 126, 126);
        }

        .no-style {
            width: 50px;
            height: 50px;
            margin: 0 17.5px;
        }
    </style>
</head>

<body>
    <div class="cal-container">
        <div class="year-month">
            <div>
                <span id="month"></span>
                <span id="year"></span>
            </div>
            <div class="pre" id="pre-month">&lt;</div>
            <div class="next" id="next-month">&gt;</div>
        </div>
        <div class="weeks">
            <ul>
                <li>一</li>
                <li>二</li>
                <li>三</li>
                <li>四</li>
                <li>五</li>
                <li>六</li>
                <li>七</li>
            </ul>
        </div>
        <div class="days">
            <ul id="day"></ul>
        </div>
    </div>
    <script>
        // 获取年月日和星期几
        let date = new Date();
        Y = date.getFullYear();
        M = date.getMonth();
        W = date.getDay();
        D = date.getDate();
        isSelect = true;    //true为选择了月，false为选择了年（添加文本阴影）

        // 更新当前年
        let yearNow = document.getElementById("year");
        yearNow.innerHTML = Y;
        // 更新当前月
        let monthNow = document.getElementById("month");
        monthNow.innerHTML = monthAndMaxDay(Y, M)[0];
        // 判断选中年还是月（添加文本阴影）
        selected(isSelect);
        //更新当前日
        let days = document.getElementById("day");
        updateAllDays(Y, M);

        // 选择按月切换还是按年切换
        yearNow.addEventListener("click", function () {
            isSelect = false
            selected(isSelect);
        });
        monthNow.addEventListener("click", function () {
            isSelect = true;
            selected(isSelect);
        });

        // 左右切换日期
        let previous = document.getElementById("pre-month");
        previous.addEventListener("click", function () { changePage(true); });
        let next = document.getElementById("next-month");
        next.addEventListener("click", function () { changePage(false); });

        // 查询一个月对应的英文命名和最大天数
        function monthAndMaxDay(year, month) {
            let month_now = "";
            let maxDay = 0;     // 一个月的最大天数
            switch (month + 1) {
                case 1: month_now = "一月碎石"; maxDay = 31; break;
                case 2:
                    month_now = "二月碎石";
                    if (year % 4 == 0) {
                        maxDay = 29;
                    } else {
                        maxDay = 28;
                    }
                    break;
                case 3: month_now = "三月碎石"; maxDay = 31; break;
                case 4: month_now = "四月碎石"; maxDay = 30; break;
                case 5: month_now = "五月碎石"; maxDay = 31; break;
                case 6: month_now = "六月碎石"; maxDay = 30; break;
                case 7: month_now = "七月碎石"; maxDay = 31; break;
                case 8: month_now = "八月碎石"; maxDay = 31; break;
                case 9: month_now = "九月碎石"; maxDay = 30; break;
                case 10: month_now = "十月碎石"; maxDay = 31; break;
                case 11: month_now = "十一月碎石"; maxDay = 30; break;
                case 12: month_now = "十二月碎石"; maxDay = 31; break;
                default: month = "";
            }
            return [month_now, maxDay];
        }

        function getStoneDate(YEAR, MONTH) {
            const START_1 = new Date(YEAR, MONTH - 1, 1);
            const END_1 = new Date(YEAR, MONTH - 1, 15);

            const START_2 = new Date(YEAR, MONTH - 1, 16);
            const END_2 = new Date(YEAR, MONTH, 0);

            function COUNT_WEEK_DAYS(START_DATE, EMD_DATE, DAY_OF_WEEK_1, DAY_OF_WEEK_2 = null) {
                let WEEK_DAYS = [];
                let CURRENT_DATE = new Date(START_DATE);

                while (CURRENT_DATE <= EMD_DATE) {
                    const DAY_OF_WEEK = CURRENT_DATE.getDay();
                    if (DAY_OF_WEEK === DAY_OF_WEEK_1 || DAY_OF_WEEK === DAY_OF_WEEK_2) {
                        WEEK_DAYS.push(CURRENT_DATE.getDate());
                    }
                    CURRENT_DATE.setDate(CURRENT_DATE.getDate() + 1);
                }

                return WEEK_DAYS;
            }

            return [[
                ...COUNT_WEEK_DAYS(START_1, END_1, 0, 6),
                ...COUNT_WEEK_DAYS(START_2, END_2, 5, 0)
            ], [
                ...COUNT_WEEK_DAYS(START_1, END_1, 2),
                ...COUNT_WEEK_DAYS(START_2, END_2, 3)
            ]]
        }

        // 更新当前月的所有天数
        function updateAllDays(year, month) {
            let offset = new Date(year, month, 0).getDay();
            let maxDay = monthAndMaxDay(year, month)[1];

            // 实现日期和星期对应
            for (let i = 0; i < offset; i++) {
                let day = document.createElement("li");
                day.className = "no-style";
                days.appendChild(day);
            }

            for (let i = 1; i <= maxDay; i++) {
                let day = document.createElement("li");
                let dateNow = new Date();
                const RED = getStoneDate(year, month + 1)[0]
                const BLACK = getStoneDate(year, month + 1)[1]
                // 当前日期有绿色背景
                if (year == dateNow.getFullYear() && month == dateNow.getMonth() && i == dateNow.getDate()) {
                    day.className = "style-default bg-style"
                } else {
                    day.className = "style-default";
                }
                day.id = i;
                day.innerText = i
                if (RED.includes(i)) {
                    day.classList.add("bgg-style");
                }
                if (BLACK.includes(i)) {
                    day.classList.add("bggg-style")
                }
                days.appendChild(day);
            }
        }

        // 选择按月切换还是按年切换
        function selected(boolean) {
            if (boolean) {
                monthNow.style.textShadow = "2px 2px 2px rgb(121, 121, 121)";
                yearNow.style.textShadow = "none";
            } else {
                monthNow.style.textShadow = "none";
                yearNow.style.textShadow = "2px 2px 2px rgb(121, 121, 121)";
            }
        }

        // 点击切换事件
        function changePage(boolean) {
            // 按年切换还是按月切换
            if (isSelect) {
                // 向前切换还是向后切换
                if (boolean) {
                    M = M - 1;
                    if (M == -1) {
                        Y--;
                        M = 11;
                    }
                } else {
                    M = M + 1;
                    if (M == 11) {
                        Y++;
                        M = 0;
                    }
                }
            } else {
                if (boolean) {
                    Y--;
                } else {
                    Y++;
                }
            }
            yearNow.innerHTML = Y;
            monthNow.innerHTML = monthAndMaxDay(Y, M)[0];
            // 清空一个月所有天数
            days.innerHTML = "";
            // 重新添加一个月所有天数
            updateAllDays(Y, M);
        }
    </script>
</body>

</html>
