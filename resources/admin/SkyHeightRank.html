<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光遇身高排行榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-width: 1000px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(145deg, #eef5ff 0%, #d9e9ff 100%);
            padding: 40px 40px;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* 主容器 —— 毛玻璃蓝白质感 */
        .container {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 40px;
            padding: 40px 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 100, 220, 0.3), 0 10px 24px -8px rgba(0, 70, 160, 0.2), inset 0 1px 3px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.8);
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
        }

        /* 标题区 —— 居中，带底部分隔线 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 26px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.7);
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 600;
            color: #0a3860;
            margin-bottom: 22px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.8);
        }

        .header-info {
            display: flex;
            justify-content: center;
            gap: 36px;
            flex-wrap: wrap;
        }

        .header-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.4);
            padding: 8px 24px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 16px rgba(0, 60, 130, 0.1);
            font-size: 1rem;
            color: #0f3b6a;
            backdrop-filter: blur(8px);
        }

        .header-info-item strong {
            color: #0051a9;
            font-weight: 600;
        }

        /* 排行榜列表 */
        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .rank-row {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 18px 28px;
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 14px 28px -14px rgba(0, 90, 200, 0.25);
        }

        /* 前三名高亮 */
        .rank-row.top1 {
            background: linear-gradient(90deg, #fff6d8, rgba(255, 255, 255, 0.6));
            border-color: #ffd979;
            box-shadow: 0 16px 30px -14px rgba(220, 160, 0, 0.4);
        }

        .rank-row.top2 {
            background: linear-gradient(90deg, #eef4ff, rgba(255, 255, 255, 0.6));
            border-color: #bcd7ff;
            box-shadow: 0 16px 30px -14px rgba(90, 140, 220, 0.35);
        }

        .rank-row.top3 {
            background: linear-gradient(90deg, #fff1e6, rgba(255, 255, 255, 0.6));
            border-color: #ffd0a8;
            box-shadow: 0 16px 30px -14px rgba(230, 140, 70, 0.35);
        }

        .rank-no {
            width: 70px;
            text-align: center;
            flex-shrink: 0;
        }

        .rank-medal {
            font-size: 40px;
            line-height: 1;
        }

        .rank-num {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 34px;
            font-weight: 700;
            color: #0a3860;
        }

        .rank-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            flex-shrink: 0;
            margin: 0 24px 0 8px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 6px 16px rgba(0, 70, 160, 0.2);
            background: linear-gradient(145deg, #8fc1ff, #4d8fe6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            user-select: none;
        }

        .rank-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .rank-avatar.hidden img {
            display: none;
        }

        .rank-info {
            flex: 1;
            min-width: 0;
        }

        .rank-name {
            font-size: 26px;
            font-weight: 600;
            color: #0a3860;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-id {
            font-size: 15px;
            color: #4a6f96;
            margin-top: 6px;
            font-family: 'Menlo', 'Courier New', monospace;
            letter-spacing: 0.5px;
        }

        .rank-value {
            text-align: right;
            flex-shrink: 0;
            margin-left: 20px;
            min-width: 170px;
        }

        .rank-height {
            font-size: 34px;
            font-weight: 700;
            color: #0051a9;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }

        .rank-unit {
            font-size: 14px;
            color: #4a6f96;
            margin-top: 6px;
        }

        /* 底部说明 */
        .rank-tip {
            margin-top: 26px;
            text-align: center;
            font-size: 14px;
            color: #5c7ba0;
            line-height: 1.9;
        }

        /* 自适应 */
        @media (max-width: 900px) {
            body {
                padding: 24px;
            }
            .container {
                padding: 28px 32px;
                border-radius: 28px;
            }
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☀️ 光遇身高排行榜</h1>
            <div class="header-info">
                <div class="header-info-item">
                    <strong>本服·本地排行</strong>
                </div>
                <div class="header-info-item">
                    <strong>参与人数:</strong> <span>{{total}}</span>
                </div>
                <div class="header-info-item">
                    <strong>更新时间:</strong> <span>{{time}}</span>
                </div>
            </div>
        </div>

        <div class="rank-list" id="rankList"></div>

        <div class="rank-tip" id="rankTip">按最新身高从高到低排序 · 昵称与游戏ID已打码保护隐私 · 数据来自本地查询记录</div>
    </div>

    <script>
        // 解析JSON数据（与 wingQuery 模板一致的注入方式）
        const rows = JSON.parse('{{@rows}}');
        const total = Number('{{total}}');
        const shown = Number('{{shown}}');
        const listEl = document.getElementById('rankList');

        // 超量截断提示
        if (total > shown) {
            const tipEl = document.getElementById('rankTip');
            tipEl.textContent = '仅展示前 ' + shown + ' 名（共 ' + total + ' 人）· ' + tipEl.textContent;
        }

        // 渲染每一行
        rows.forEach(item => {
            const row = document.createElement('div');
            row.className = 'rank-row' + (item.rank <= 3 ? ' top' + item.rank : '');

            // 名次
            const rankCell = document.createElement('div');
            rankCell.className = 'rank-no';
            if (item.medal) {
                rankCell.innerHTML = '<div class="rank-medal">' + item.medal + '</div>';
            } else {
                rankCell.innerHTML = '<div class="rank-num">' + item.rank + '</div>';
            }

            // 头像（无头像/加载失败时显示昵称首字占位）
            const avatarCell = document.createElement('div');
            avatarCell.className = 'rank-avatar';
            if (item.avatar) {
                const img = document.createElement('img');
                img.src = item.avatar;
                img.alt = '';
                img.onerror = function () {
                    avatarCell.classList.add('hidden');
                    avatarCell.textContent = item.char || '旅';
                };
                avatarCell.appendChild(img);
            } else {
                avatarCell.textContent = item.char || '旅';
            }

            // 昵称 + 游戏ID
            const infoCell = document.createElement('div');
            infoCell.className = 'rank-info';
            const name = document.createElement('div');
            name.className = 'rank-name';
            name.textContent = item.nickname;
            const id = document.createElement('div');
            id.className = 'rank-id';
            id.textContent = item.gameId;
            infoCell.appendChild(name);
            infoCell.appendChild(id);

            // 身高值
            const valueCell = document.createElement('div');
            valueCell.className = 'rank-value';
            const height = document.createElement('div');
            height.className = 'rank-height';
            height.textContent = item.height;
            const unit = document.createElement('div');
            unit.className = 'rank-unit';
            unit.textContent = '当前身高';
            valueCell.appendChild(height);
            valueCell.appendChild(unit);

            row.appendChild(rankCell);
            row.appendChild(avatarCell);
            row.appendChild(infoCell);
            row.appendChild(valueCell);

            listEl.appendChild(row);
        });
    </script>
</body>
</html>
